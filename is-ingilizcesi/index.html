<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İş İngilizcesi">
<meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>İş İngilizcesi</title>
<style>
:root{
  --paper:#F6F4EE; --raised:#FFFFFF; --ink:#182338; --soft:#4E5A72; --faint:#8A93A6;
  --hair:#DAD4C4; --teal:#1F6F6B; --teal-deep:#154F4C; --teal-wash:#E3EFEC;
  --amber:#A9791A; --amber-wash:#F4EAD3; --brick:#A8433D; --brick-wash:#F5E2DF;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  --tabh: 58px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12161F; --raised:#1B2130; --ink:#EDEAE2; --soft:#A9B0C0; --faint:#6F788C;
    --hair:#2C3346; --teal:#4FB3AC; --teal-deep:#6CC6BF; --teal-wash:#1C3533;
    --amber:#D8AC4E; --amber-wash:#3A3020; --brick:#D67971; --brick-wash:#3B2424;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
button{font-family:inherit;color:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px);min-height:100vh;}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--raised);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom);}
.tabbar-in{max-width:560px;margin:0 auto;display:flex;height:var(--tabh);}
.tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--faint);cursor:pointer;}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tabbar button.on{color:var(--teal);}

h1.page{font-family:var(--serif);font-weight:600;font-size:28px;margin:6px 0 4px;letter-spacing:-.2px;}
.sub{color:var(--soft);font-size:14px;margin:0 0 18px;}
.section-title{font-family:var(--serif);font-size:19px;font-weight:600;margin:28px 0 10px;}

/* home */
.today{background:var(--raised);border:1px solid var(--hair);border-radius:18px;padding:20px;display:flex;gap:18px;align-items:center;}
.ring{flex:0 0 auto;position:relative;width:96px;height:96px;}
.ring svg{width:96px;height:96px;transform:rotate(-90deg);}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .lbl b{font-family:var(--serif);font-size:24px;font-weight:600;}
.ring .lbl span{font-size:11px;color:var(--soft);}
.today-info{flex:1;min-width:0;}
.today-info .streak{font-size:14px;color:var(--amber);font-weight:600;margin-bottom:8px;}
.today-info .line{font-size:14px;color:var(--soft);line-height:1.6;}
.today-info .line b{color:var(--ink);font-weight:600;}
.btn{display:block;width:100%;padding:15px 0;border-radius:12px;border:none;background:var(--teal);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;}
@media (prefers-color-scheme: dark){ .btn{color:#0E1414;} }
.btn.ghost{background:var(--raised);color:var(--ink);border:1px solid var(--hair);font-weight:500;}
.btn.small{padding:11px 0;font-size:14.5px;margin-top:10px;}
.btn:disabled{opacity:.45;cursor:default;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

.stats3{display:flex;gap:10px;margin-top:12px;}
.stat{flex:1;background:var(--raised);border:1px solid var(--hair);border-radius:14px;padding:12px 12px 11px;}
.stat b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;}
.stat span{font-size:12px;color:var(--soft);}

.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;}
.cat-row .cn{flex:1;min-width:0;}
.cat-row .cn div{font-size:15px;}
.cat-row .bar{height:5px;background:var(--hair);border-radius:3px;margin-top:7px;overflow:hidden;display:flex;}
.cat-row .bar i{display:block;height:100%;}
.cat-row .bar .m{background:var(--teal);} .cat-row .bar .l{background:var(--amber);}
.cat-row .pct{font-family:var(--mono);font-size:12px;color:var(--soft);width:64px;text-align:right;}
.legend{display:flex;gap:14px;font-size:12px;color:var(--soft);margin-top:8px;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

.tip{margin-top:18px;padding:14px;border-radius:14px;background:var(--amber-wash);font-size:13.5px;line-height:1.5;color:var(--ink);display:flex;gap:10px;}
.tip button{background:none;border:none;font-size:18px;color:var(--soft);cursor:pointer;padding:0 2px;align-self:flex-start;}

/* study */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.sess-top .x{background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;padding:4px 6px 4px 0;}
.sess-top .track{flex:1;height:6px;background:var(--hair);border-radius:3px;overflow:hidden;}
.sess-top .track i{display:block;height:100%;background:var(--teal);transition:width .3s;}
.sess-top .cnt{font-family:var(--mono);font-size:12px;color:var(--soft);}
.fc{background:var(--raised);border:1px solid var(--hair);border-radius:20px;padding:26px 22px 22px;min-height:360px;display:flex;flex-direction:column;}
.fc .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--teal-deep);}
.fc .meta .tag{color:var(--soft);}
.fc .new-badge{background:var(--amber-wash);color:var(--amber);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;}
.fc .front{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0 10px;}
.fc .term{font-family:var(--serif);font-size:34px;line-height:1.15;margin:0;}
.fc .term-tr{font-family:var(--serif);font-size:28px;line-height:1.2;margin:0;color:var(--teal-deep);}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--teal-wash);color:var(--teal-deep);border:none;border-radius:20px;padding:7px 13px;font-size:13.5px;cursor:pointer;margin-top:14px;align-self:flex-start;}
.say svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.say-row{display:flex;gap:8px;flex-wrap:wrap;}
.back{border-top:1px solid var(--hair);padding-top:16px;margin-top:6px;}
.back .tr{font-family:var(--serif);font-size:21px;color:var(--teal-deep);margin-bottom:10px;}
.back .en-term{font-family:var(--serif);font-size:21px;margin-bottom:10px;}
.back .def{font-size:15px;line-height:1.5;margin-bottom:10px;}
.back .ex{font-size:14.5px;line-height:1.5;color:var(--soft);font-style:italic;}
.reveal{margin-top:16px;}
.grade{display:flex;gap:8px;margin-top:16px;}
.grade button{flex:1;border:none;border-radius:12px;padding:12px 4px 10px;cursor:pointer;font-size:15px;font-weight:600;}
.grade button small{display:block;font-size:11px;font-weight:400;margin-top:3px;opacity:.8;}
.g-again{background:var(--brick-wash);color:var(--brick);}
.g-hard{background:var(--amber-wash);color:var(--amber);}
.g-good{background:var(--teal-wash);color:var(--teal-deep);}
.fav-toggle{background:none;border:none;font-size:20px;cursor:pointer;color:var(--faint);padding:0 0 0 8px;}
.fav-toggle.on{color:var(--amber);}

.done{text-align:center;padding:30px 10px;}
.done .big{font-family:var(--serif);font-size:30px;margin:10px 0 6px;}
.done p{color:var(--soft);font-size:15px;line-height:1.5;}

/* dictionary */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--raised);color:var(--ink);font-size:16px;font-family:var(--sans);-webkit-appearance:none;}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:16px;border:1px solid var(--hair);background:var(--raised);font-size:13px;color:var(--soft);white-space:nowrap;cursor:pointer;}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.count-line{font-size:12.5px;color:var(--soft);margin:12px 0 2px;}
.item{border-bottom:1px solid var(--hair);}
.item-head{display:flex;align-items:center;gap:10px;padding:13px 0;cursor:pointer;width:100%;background:none;border:none;text-align:left;}
.item-head .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--hair);}
.dot.l{background:var(--amber);} .dot.m{background:var(--teal);}
.item-head .t{flex:1;min-width:0;}
.item-head .t b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;}
.item-head .t span{display:block;font-size:13px;color:var(--soft);margin-top:2px;}
.item-head .star{color:var(--amber);font-size:14px;}
.icon-btn{background:none;border:1px solid var(--hair);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--teal-deep);flex:0 0 auto;}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.item-body{padding:0 0 16px 18px;}
.item-body .def{font-size:14.5px;line-height:1.5;margin-bottom:8px;}
.item-body .ex{font-size:14px;line-height:1.5;color:var(--soft);font-style:italic;margin-bottom:12px;}
.item-body .meta{font-size:12px;color:var(--faint);margin-bottom:10px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{border:1px solid var(--hair);background:var(--raised);border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;}
.pill.on{background:var(--amber-wash);border-color:var(--amber);color:var(--amber);}
.more{display:block;margin:16px auto 0;}
.empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:14.5px;line-height:1.5;}

/* test */
.mode-list{display:flex;flex-direction:column;gap:10px;}
.mode{display:flex;gap:14px;align-items:center;background:var(--raised);border:1px solid var(--hair);border-radius:14px;padding:15px;cursor:pointer;text-align:left;width:100%;}
.mode .ic{width:40px;height:40px;border-radius:11px;background:var(--teal-wash);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.mode .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.mode b{display:block;font-size:15.5px;font-weight:600;}
.mode span{display:block;font-size:13px;color:var(--soft);margin-top:2px;}
.field-label{font-size:13px;color:var(--soft);margin:18px 0 8px;}
.seg{display:flex;background:var(--raised);border:1px solid var(--hair);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px 2px;font-size:13.5px;cursor:pointer;color:var(--soft);}
.seg button.on{background:var(--ink);color:var(--paper);}
.q-card{background:var(--raised);border:1px solid var(--hair);border-radius:20px;padding:22px 20px;}
.q-card .ask{font-size:13px;color:var(--teal-deep);}
.q-card .q{font-family:var(--serif);font-size:28px;line-height:1.2;margin:10px 0 4px;}
.q-card .hint{font-size:13px;color:var(--soft);margin-bottom:16px;}
.listen-big{width:84px;height:84px;border-radius:50%;border:none;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;margin:14px auto 18px;cursor:pointer;}
.listen-big svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:9px;border-radius:12px;border:1px solid var(--hair);background:var(--paper);font-size:15.5px;cursor:pointer;line-height:1.35;}
.opt.ok{background:var(--teal);border-color:var(--teal);color:#fff;}
.opt.bad{background:var(--brick);border-color:var(--brick);color:#fff;}
.opt:disabled{cursor:default;}
.type-in{width:100%;padding:14px;border-radius:12px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);font-size:18px;font-family:var(--serif);-webkit-appearance:none;}
.type-in.ok{border-color:var(--teal);background:var(--teal-wash);}
.type-in.bad{border-color:var(--brick);background:var(--brick-wash);}
.feedback{margin-top:12px;font-size:14.5px;line-height:1.5;}
.feedback b{font-family:var(--serif);font-size:17px;}
.feedback .ex{color:var(--soft);font-style:italic;margin-top:6px;}

/* settings */
.set-group{background:var(--raised);border:1px solid var(--hair);border-radius:14px;overflow:hidden;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--hair);font-size:15px;}
.set-row:last-child{border-bottom:none;}
.set-row small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--paper);font-size:18px;cursor:pointer;}
.stepper b{min-width:34px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:500;}
.switch{width:50px;height:30px;border-radius:15px;background:var(--hair);border:none;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch.on{background:var(--teal);}
.switch.on::after{left:23px;}
.set-row select{font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);max-width:170px;}
textarea.backup{width:100%;min-height:110px;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--hair);background:var(--raised);color:var(--ink);font-family:var(--mono);font-size:12px;}
.foot{font-size:12px;color:var(--faint);text-align:center;margin-top:26px;line-height:1.6;}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
"use strict";
/* ================= DATA ================= */
const CATS = {
  ops:"Satın Alma & Tedarik", neg:"Müzakere & Sözleşme", fin:"Finans & Muhasebe",
  mtg:"Toplantı & E-posta", rep:"Sunum & Raporlama", idiom:"İş Deyimleri",
  mgmt:"Yönetim & Liderlik", strat:"Strateji & Planlama", sales:"Satış & Pazarlama",
  hr:"İK & İşe Alım", legal:"Hukuk & Uyumluluk", pv:"Phrasal Verbs",
  gen:"Temel İş Kelimeleri", colloc:"Kalıp İfadeler", econ:"Ekonomi & Bankacılık",
  tech:"Teknoloji & Dijital", prod:"Üretim & Kalite", cust:"Müşteri Hizmetleri", travel:"İş Seyahati & Fuar"
};
const CAT_ORDER = ["ops","neg","fin","mtg","pv","gen","colloc","rep","idiom","econ","mgmt","strat","sales","cust","prod","tech","hr","legal","travel"];
const WORDS = RAW.map(r=>({key:r[0].toLowerCase(), term:r[0], tr:r[1], def:r[2], ex:r[3], cat:r[4], type:r[5], set:r[6]||"biz"}));
const SETS = {mix:"Tüm terimler (karışık)", biz:"Önce ilk 500 kurumsal terim", cam:"Önce Cambridge ek 1000"};
const BY_KEY = Object.fromEntries(WORDS.map(w=>[w.key,w]));
// Learning order: interleave categories so new words don't come in one block
const NEW_ORDER = (()=>{
  const buckets = CAT_ORDER.map(c=>WORDS.filter(w=>w.cat===c));
  const out=[]; let i=0, left=true;
  while(left){ left=false; buckets.forEach(b=>{ if(b[i]){ out.push(b[i]); left=true; } }); i++; }
  return out;
})();

/* ================= STORAGE ================= */
const LS = "is-ingilizcesi-v2";
const DEFAULT = {
  cards:{},            // key -> {b:box, d:due 'YYYY-MM-DD', r:right, w:wrong, s:firstSeen}
  favs:{},
  log:{},              // date -> {rev, nw}
  set:{newPerDay:10, goal:30, rate:0.9, accent:"en-GB", auto:true, dir:"en", src:"mix"},
  tipOff:false
};
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS)||"null");
    if(s && s.cards) return {...DEFAULT, ...s, set:{...DEFAULT.set, ...(s.set||{})}};
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
let S = load();
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

/* ================= DATES / SRS ================= */
function dstr(d){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function today(){ return dstr(new Date()); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return dstr(d); }
const INTERVALS = [0,1,2,4,8,16,32,64];   // days per box
const MASTER_BOX = 5;                      // box >= 5 → öğrenildi
function status(key){
  const c=S.cards[key];
  if(!c) return "new";
  return c.b>=MASTER_BOX ? "m" : "l";
}
function dayLog(){ const t=today(); if(!S.log[t]) S.log[t]={rev:0,nw:0}; return S.log[t]; }
function grade(key, g){ // g: 0 again, 1 hard, 2 good
  const t=today(); let c=S.cards[key]; const isNew=!c;
  if(!c){ c={b:0,d:t,r:0,w:0,s:t}; S.cards[key]=c; }
  if(g===0){ c.b=0; c.w++; c.d=t; }
  else if(g===1){ c.b=Math.max(1,c.b); c.r++; c.d=addDays(Math.max(1,Math.round(INTERVALS[c.b]/2))); }
  else { c.b=Math.min(INTERVALS.length-1, c.b+1); c.r++; c.d=addDays(INTERVALS[c.b]); }
  const L=dayLog(); L.rev++; if(isNew) L.nw++;
  save();
}
function quizResult(key, ok){
  let c=S.cards[key]; const t=today();
  if(!c){ if(!ok) { S.cards[key]={b:0,d:t,r:0,w:1,s:t}; dayLog().nw++; } }
  else if(ok){ c.r++; }
  else { c.w++; c.b=Math.max(0,c.b-2); c.d=t; }
  dayLog().rev++; save();
}
function dueKeys(cat){
  const t=today();
  return Object.entries(S.cards).filter(([k,c])=>c.d<=t && BY_KEY[k] && (!cat||BY_KEY[k].cat===cat))
    .sort((a,b)=>a[1].d<b[1].d?-1:a[1].d>b[1].d?1:a[1].b-b[1].b).map(([k])=>k);
}
function newLeftToday(){ return Math.max(0, S.set.newPerDay - (S.log[today()]?.nw||0)); }
function newKeys(cat, n){
  let pool = NEW_ORDER.filter(w=>!S.cards[w.key] && (!cat||w.cat===cat));
  if(S.set.src!=="mix") pool = [...pool.filter(w=>w.set===S.set.src), ...pool.filter(w=>w.set!==S.set.src)];
  return pool.slice(0,n).map(w=>w.key);
}
function streak(){
  let n=0; const d=new Date();
  if(!(S.log[dstr(d)]?.rev>0)) d.setDate(d.getDate()-1); // today not yet done → count from yesterday
  while(S.log[dstr(d)]?.rev>0){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function counts(cat){
  const list = cat? WORDS.filter(w=>w.cat===cat) : WORDS;
  let m=0,l=0; list.forEach(w=>{ const s=status(w.key); if(s==="m")m++; else if(s==="l")l++; });
  return {total:list.length, m, l, n:list.length-m-l};
}

/* ================= SPEECH ================= */
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices()||[]; }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  const a=S.set.accent;
  const good = v=>/(Enhanced|Premium|Samantha|Daniel|Karen|Serena|Arthur|Martha)/i.test(v.name);
  return voices.find(v=>v.lang===a && good(v)) || voices.find(v=>v.lang===a) ||
         voices.find(v=>v.lang&&v.lang.replace("_","-").startsWith(a)) ||
         voices.find(v=>v.lang&&v.lang.startsWith("en"));
}
function speak(text, slow){
  if(!("speechSynthesis" in window)) { toast("Bu cihazda sesli okuma desteklenmiyor"); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v) u.voice=v;
    u.lang=(v&&v.lang)||S.set.accent;
    u.rate = slow ? 0.6 : S.set.rate;
    speechSynthesis.speak(u);
  }catch(e){}
}

function startStudy(cat, extraNew){
  const due=dueKeys(cat);
  const nn = extraNew ?? newLeftToday();
  const nw=newKeys(cat, nn);
  // mix: due first in chunks, new interleaved every 3 cards
  const q=[]; let i=0,j=0;
  while(i<due.length||j<nw.length){
    for(let k=0;k<3&&i<due.length;k++) q.push(due[i++]);
    if(j<nw.length) q.push(nw[j++]);
  }
  if(!q.length){ toast(cat? "Bu kategoride şu an çalışılacak kart yok" : "Çalışılacak kart yok"); return; }
  sess={q, idx:0, shown:false, done:0, total:q.length, again:{}, cat, stats:{0:0,1:0,2:0}, dirFlip:null};
  view="study"; render(); window.scrollTo(0,0);
  autoSpeakFront();
}
function curDir(){
  if(S.set.dir==="mix"){ if(sess.dirFlip===null) sess.dirFlip=Math.random()<.5; return sess.dirFlip?"tr":"en"; }
  return S.set.dir;
}
function autoSpeakFront(){
  if(!sess||sess.idx>=sess.q.length||!S.set.auto) return;
  if(curDir()!=="en") return;
  const key=sess.q[sess.idx];
  setTimeout(()=>{ if(sess && sess.q[sess.idx]===key && !sess.shown) speak(BY_KEY[key].term); },250);
}

  </div>` : `<button class="btn reveal" data-act="show">Cevabı göster</button>`}
  `;
}
function doGrade(g){
  const key=sess.q[sess.idx];
  grade(key,g); sess.stats[g]++; sess.done++;
  if(g===0){ // requeue a few cards later, max twice
    sess.again[key]=(sess.again[key]||0)+1;
    if(sess.again[key]<=2){ const pos=Math.min(sess.q.length, sess.idx+4); sess.q.splice(pos,0,key); }
  }
  sess.idx++; sess.shown=false; sess.dirFlip=null;
  render(); autoSpeakFront();
}

/* ================= DICTIONARY ================= */
function norm(s){ return s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ı/g,"i"); }
function dictList(){
  const q=norm(dict.q.trim());
  return WORDS.filter(w=>{
    if(dict.cat!=="all" && w.cat!==dict.cat) return false;
    const s=status(w.key);
    if(dict.st==="fav" && !S.favs[w.key]) return false;
    if(dict.st==="new" && s!=="new") return false;
    if(dict.st==="l" && s!=="l") return false;
    if(dict.st==="m" && s!=="m") return false;
    if(q && !norm(w.term).includes(q) && !norm(w.tr).includes(q)) return false;
    return true;
  }).sort((a,b)=>a.term.localeCompare(b.term,"en",{sensitivity:"base"}));
}
function dictView(){
  const list=dictList();
  const sts=[["all","Tümü"],["fav","★ Favoriler"],["new","Yeni"],["l","Öğreniliyor"],["m","Öğrenildi"]];

  }
  const w=BY_KEY[quiz.items[quiz.i]], m=quiz.mode;
  const head=`<div class="sess-top"><button class="x" data-act="tExit" aria-label="Kapat">×</button><div class="track"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div><div class="cnt">${quiz.i+1}/${quiz.items.length}</div></div>`;
  let body="";
  if(m==="type"){
    const ans=quiz.answered;
    body=`<div class="q-card"><div class="ask">İngilizcesini yaz</div><div class="q">${esc(w.tr)}</div><div class="hint">${CATS[w.cat]} · ${w.term.split(" ").length} kelime</div>
      <form data-act="tSubmit" autocomplete="off"><input id="typeIn" class="type-in ${ans?(quiz.lastOk?"ok":"bad"):""}" ${ans?"readonly":""} value="${esc(quiz.typed||"")}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="cevabını yaz…" enterkeyhint="done">
      ${ans?"":`<button class="btn" type="submit">Kontrol et</button><button class="btn ghost small" type="button" data-act="tSkip">Bilmiyorum</button>`}</form>
      ${ans?`<div class="feedback">${quiz.lastOk?"✓ Doğru":"✗ Doğru cevap:"} <b>${esc(w.term)}</b><div class="ex">“${esc(w.ex)}”</div></div>`:""}
    </div>`;
  } else {
    const opts=quiz.opts;
    const label=o=> (m==="en2tr"||m==="listen") ? o.tr : o.term;
    let prompt="";
    if(m==="en2tr") prompt=`<div class="ask">Türkçe anlamı hangisi?</div><div class="q">${esc(w.term)}</div><div class="say-row" style="margin-bottom:14px"><button class="say" style="margin-top:4px" data-act="say" data-k="${esc(w.key)}">${svg("sound")}Dinle</button></div>`;
    else if(m==="tr2en") prompt=`<div class="ask">İngilizcesi hangisi?</div><div class="q">${esc(w.tr)}</div><div class="hint">${CATS[w.cat]}</div>`;
    else if(m==="def") prompt=`<div class="ask">Bu tanım hangi terime ait?</div><div class="q" style="font-size:21px;line-height:1.35">${esc(w.def)}</div><div class="hint">${CATS[w.cat]}</div>`;
    else prompt=`<div class="ask">Duyduğun terimin anlamı hangisi?</div><button class="listen-big" data-act="say" data-k="${esc(w.key)}" aria-label="Tekrar dinle">${svg("sound")}</button>${quiz.answered?`<div class="q" style="text-align:center;font-size:24px">${esc(w.term)}</div>`:`<div class="hint" style="text-align:center">Dokunarak tekrar dinle</div>`}`;
    body=`<div class="q-card">${prompt}
      ${opts.map((o,ix)=>{ let cls="opt"; if(quiz.answered){ if(o.key===w.key) cls+=" ok"; else if(ix===quiz.sel) cls+=" bad"; }
        return `<button class="${cls}" data-act="tPick" data-i="${ix}" ${quiz.answered?"disabled":""}>${esc(label(o))}</button>`; }).join("")}
      ${quiz.answered && m!=="en2tr" ? `<div class="feedback"><b>${esc(w.term)}</b> — ${esc(w.tr)}<div class="ex">“${esc(w.ex)}”</div></div>`:""}
      ${quiz.answered && m==="en2tr" ? `<div class="feedback"><div class="ex" style="margin-top:0">“${esc(w.ex)}”</div></div>`:""}
    </div>`;
  }
  return head+body+(quiz.answered?`<button class="btn" data-act="tNext">${quiz.i+1>=quiz.items.length?"Sonuçları gör":"Sonraki soru"}</button>`:"");
}
function testPool(){
  let pool=WORDS;
  if(testCfg.src==="learned") pool=WORDS.filter(w=>S.cards[w.key]);
  if(testCfg.src==="hard") pool=WORDS.filter(w=>{const c=S.cards[w.key]; return c&&(c.w>0||c.b<=1);});
  if(testCfg.src==="fav") pool=WORDS.filter(w=>S.favs[w.key]);
  return pool;
}
function startTest(mode){
  const pool=testPool();
  if(pool.length<1){ toast(testCfg.src==="fav"?"Önce birkaç favori ekle":testCfg.src==="hard"?"Henüz zorlandığın kelime yok":"Önce Çalış bölümünde birkaç kelime çalış"); return; }
  quiz={mode, items:shuffle(pool).slice(0,testCfg.n).map(w=>w.key), i:0, score:0, answered:false, wrong:[]};
  prepQ(); render(); window.scrollTo(0,0);
}
function prepQ(){
  quiz.answered=false; quiz.sel=-1; quiz.typed=""; quiz.lastOk=false;
  if(quiz.i>=quiz.items.length) return;
  const w=BY_KEY[quiz.items[quiz.i]];
  if(quiz.mode!=="type"){
    const same=WORDS.filter(x=>x.cat===w.cat && x.key!==w.key && x.tr!==w.tr);
    const src= same.length>=3 ? same : WORDS.filter(x=>x.key!==w.key);
    quiz.opts=shuffle([w,...shuffle(src).slice(0,3)]);
  }
  if(quiz.mode==="listen") setTimeout(()=>speak(w.term),300);
}
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function checkTyped(typed, w){
  const n=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const a=n(typed), b=n(w.term);
  if(!a) return false;
  if(a===b) return true;
  return lev(a,b) <= (b.length>=8?2:b.length>=5?1:0);
}
function answer(ok){
  const key=quiz.items[quiz.i];
  quiz.answered=true; quiz.lastOk=ok;
  if(ok) quiz.score++; else quiz.wrong.push(key);
  quizResult(key, ok);
  render();
  if(quiz.mode!=="listen" && !ok) setTimeout(()=>speak(BY_KEY[key].term),200);
}

/* ================= SETTINGS ================= */
function setView(){
  const s=S.set;
  const step=(k,v,lbl)=>`<div class="stepper"><button data-act="step" data-k="${k}" data-d="-1" aria-label="Azalt">−</button><b>${v}</b><button data-act="step" data-k="${k}" data-d="1" aria-label="Artır">+</button></div>`;
  return `<h1 class="page">Ayarlar</h1>
  <div class="section-title" style="margin-top:14px">Çalışma</div>
  <div class="set-group">
    <div class="set-row"><div>Günlük yeni kelime<small>Her gün eklenecek yeni kart sayısı</small></div>${step("newPerDay",s.newPerDay)}</div>
    <div class="set-row"><div>Günlük hedef<small>Halkayı dolduran kart sayısı</small></div>${step("goal",s.goal)}</div>
    <div class="set-row"><div>Yeni kelime sırası</div>
      <select data-act="setSel" data-k="src">${Object.entries(SETS).map(([k,l])=>`<option value="${k}" ${s.src===k?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="set-row"><div>Kart yönü</div>
      <select data-act="setSel" data-k="dir"><option value="en" ${s.dir==="en"?"selected":""}>İngilizce → Türkçe</option><option value="tr" ${s.dir==="tr"?"selected":""}>Türkçe → İngilizce</option><option value="mix" ${s.dir==="mix"?"selected":""}>Karışık</option></select></div>
  </div>
  <div class="section-title">Telaffuz</div>
  <div class="set-group">
    <div class="set-row"><div>Aksan</div>
      <select data-act="setSel" data-k="accent"><option value="en-GB" ${s.accent==="en-GB"?"selected":""}>İngiliz (UK)</option><option value="en-US" ${s.accent==="en-US"?"selected":""}>Amerikan (US)</option></select></div>
    <div class="set-row"><div>Konuşma hızı</div>
      <select data-act="setSel" data-k="rate"><option value="0.75" ${s.rate==0.75?"selected":""}>Yavaş</option><option value="0.9" ${s.rate==0.9?"selected":""}>Normal</option><option value="1" ${s.rate==1?"selected":""}>Doğal</option></select></div>
    <div class="set-row"><div>Kartı otomatik seslendir</div><button class="switch ${s.auto?"on":""}" data-act="toggleAuto" aria-label="Otomatik seslendirme"></button></div>
    <div class="set-row"><div>Sesi dene</div><button class="icon-btn" data-act="sayRaw" data-t="Let's touch base next week to finalize the payment terms.">${svg("sound")}</button></div>
  </div>
  <p class="sub" style="font-size:12.5px;margin-top:8px;line-height:1.5">Daha doğal ses için iPhone'da Ayarlar → Erişilebilirlik → Seslendirilen İçerik → Sesler → İngilizce bölümünden "Gelişmiş" bir ses (ör. Daniel, Serena) indirebilirsin.</p>

  <div class="section-title">Yedekleme</div>
  <p class="sub" style="font-size:13.5px;line-height:1.5">İlerlemen yalnızca bu telefonda saklanır. Yedek kodunu Notlar'a kaydedip başka cihazda geri yükleyebilirsin.</p>
  <div class="btn-row"><button class="btn ghost small" data-act="exp">Yedek kodunu kopyala</button><button class="btn ghost small" data-act="impShow">Yedeği geri yükle</button></div>
  <div id="impBox"></div>
  <button class="btn ghost small" style="color:var(--brick);margin-top:22px" data-act="reset">Tüm ilerlemeyi sıfırla</button>
  <div class="foot">İş İngilizcesi · ${WORDS.length} terim · ${Object.keys(S.cards).length} kart çalışıldı</div>`;
}

/* ================= EVENTS ================= */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, k=el.dataset.k;
  if(a==="say"||a==="saySlow"||a==="sayEx"||a==="sayRaw"||a==="fav"||a==="markKnown") e.stopPropagation();
  switch(a){
    case "tab": if(el.dataset.v==="test") quiz=null; go(el.dataset.v); break;
    case "go": if(el.dataset.v==="test") quiz=null; sess=null; go(el.dataset.v); break;
    case "startStudy": startStudy(null); break;
    case "extraNew": startStudy(null, 10); break;
    case "catStudy": {
      startStudy(el.dataset.cat, Math.max(newLeftToday(),5)); break; }
    case "hardStudy": {
      const keys=Object.entries(S.cards).filter(([k,c])=>c.w>0||c.b<=1).sort((a,b)=>b[1].w-a[1].w).slice(0,20).map(([k])=>k);
      if(!keys.length){ toast("Henüz zorlandığın kelime yok"); break; }
      sess={q:shuffle(keys), idx:0, shown:false, done:0, again:{}, stats:{0:0,1:0,2:0}, dirFlip:null}; go("study"); autoSpeakFront(); break; }
    case "favStudy": {
      const keys=Object.keys(S.favs).filter(k=>S.favs[k]&&BY_KEY[k]);
      if(!keys.length){ toast("Henüz favorin yok"); break; }
      sess={q:shuffle(keys), idx:0, shown:false, done:0, again:{}, stats:{0:0,1:0,2:0}, dirFlip:null}; go("study"); autoSpeakFront(); break; }
    case "endStudy": sess=null; go("home"); break;
    case "show": sess.shown=true; render(); if(curDir()==="tr"&&S.set.auto) speak(BY_KEY[sess.q[sess.idx]].term); break;
    case "grade": doGrade(+el.dataset.g); break;
    case "say": speak(BY_KEY[k].term); break;
    case "saySlow": speak(BY_KEY[k].term, true); break;
    case "sayEx": speak(BY_KEY[k].ex); break;
    case "sayRaw": speak(el.dataset.t); break;
    case "fav": S.favs[k]=!S.favs[k]; if(!S.favs[k]) delete S.favs[k]; save(); toast(S.favs[k]?"Favorilere eklendi":"Favorilerden çıkarıldı"); rerenderKeepScroll(); break;
    case "markKnown": S.cards[k]={b:MASTER_BOX,d:addDays(INTERVALS[MASTER_BOX]),r:1,w:0,s:today()}; save(); toast("Öğrenildi olarak işaretlendi"); rerenderKeepScroll(); break;
    case "tipOff": S.tipOff=true; save(); render(); break;
    case "dSt": dict.st=el.dataset.v; dict.limit=60; dict.open=null; render(); break;
    case "dCat": dict.cat=el.dataset.v; dict.limit=60; dict.open=null; render(); break;
    case "dOpen": dict.open = dict.open===k?null:k; rerenderKeepScroll(); break;
    case "dMore": dict.limit+=100; rerenderKeepScroll(); break;
    case "tSrc": testCfg.src=el.dataset.v; render(); break;
    case "tN": testCfg.n=+el.dataset.v; render(); break;
    case "tStart": startTest(el.dataset.m); break;
    case "tPick": if(quiz.answered) break; quiz.sel=+el.dataset.i; answer(quiz.opts[quiz.sel].key===quiz.items[quiz.i]); break;
    case "tSkip": quiz.typed=""; answer(false); break;
    case "tNext": quiz.i++; prepQ(); render(); window.scrollTo(0,0); break;
    case "tAgain": startTest(quiz.mode); break;
    case "tExit": quiz=null; render(); break;
    case "step": { const key=el.dataset.k, d=+el.dataset.d; const stepSz=key==="goal"?5:1;
      const lim = key==="goal"?[5,200]:[0,50];
      S.set[key]=Math.max(lim[0],Math.min(lim[1],S.set[key]+d*stepSz)); save(); render(); break; }
    case "toggleAuto": S.set.auto=!S.set.auto; save(); render(); break;
    case "exp": {
      const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      const done=()=>toast("Yedek kodu kopyalandı");
      if(navigator.clipboard) navigator.clipboard.writeText(code).then(done,()=>showCode(code)); else showCode(code);
      break; }
    case "impShow": $("#impBox").innerHTML=`<textarea class="backup" id="impTxt" placeholder="Yedek kodunu buraya yapıştır"></textarea><button class="btn small" data-act="imp">Geri yükle</button>`; break;
    case "imp": try{
        const obj=JSON.parse(decodeURIComponent(escape(atob($("#impTxt").value.trim()))));
        if(!obj.cards) throw 0; S={...DEFAULT,...obj,set:{...DEFAULT.set,...(obj.set||{})}}; save(); toast("Yedek geri yüklendi"); go("home");
      }catch(err){ toast("Kod okunamadı, tamamını kopyaladığından emin ol"); } break;
    case "reset": if(confirm("Tüm ilerleme, favoriler ve seri silinecek. Emin misin?")){ S=JSON.parse(JSON.stringify(DEFAULT)); save(); toast("Sıfırlandı"); go("home"); } break;
  }
});
function showCode(code){ $("#impBox").innerHTML=`<textarea class="backup" readonly>${code}</textarea><p class="sub" style="font-size:12.5px">Kodu seçip kopyala.</p>`; }
function rerenderKeepScroll(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
document.addEventListener("submit", e=>{
  if(e.target.dataset.act==="tSubmit"){ e.preventDefault(); if(quiz.answered) return;
    quiz.typed=$("#typeIn").value; answer(checkTyped(quiz.typed, BY_KEY[quiz.items[quiz.i]])); }
});
document.addEventListener("change", e=>{
  const el=e.target; if(el.dataset.act!=="setSel") return;
  const k=el.dataset.k; S.set[k]= k==="rate" ? +el.value : el.value; save();
  if(k==="accent"||k==="rate") speak("procurement");
});
let qT;
document.addEventListener("input", e=>{
  if(e.target.id==="dictQ"){ dict.q=e.target.value; dict.limit=60; clearTimeout(qT);
    qT=setTimeout(()=>{ const b=$("#dictBody"); if(b) b.innerHTML=dictBody(dictList()); },120); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.classList?.contains("item-head")) e.target.click();
});
// re-render home when coming back next day
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && view==="home") render(); });

render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
