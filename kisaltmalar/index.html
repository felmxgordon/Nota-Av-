/* Layout: sticky search + category filter rail, then a dense scannable list of abbreviation rows */
:root{

  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;

  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#171e27; --fg:#e6ebf1; --muted:#97a3b3; --line:#28323f;
  --accent:#f0a63a; --accent-soft:#2c2214; --chip:#202a36; --warn:#f08a70; --warn-soft:#2e1a15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#171e27; --fg:#e6ebf1; --muted:#97a3b3; --line:#28323f;
  --accent:#f0a63a; --accent-soft:#2c2214; --chip:#202a36; --warn:#f08a70; --warn-soft:#2e1a15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 48px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
header p{color:var(--muted);margin:8px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 14px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;padding:12px 0;outline:none}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px/1 var(--body);border:1px solid transparent;background:var(--chip);color:var(--fg);padding:8px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.chip:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:28px}
section h2{font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;color:var(--muted);display:flex;gap:10px;align-items:baseline}
section h2 span{font-family:var(--mono);font-size:13px;letter-spacing:0}
.row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 18px;padding:12px 0;border-top:1px solid var(--line)}
.abbr{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--accent);word-break:break-word}
.full{font-weight:600}
.tr{color:var(--muted)}
.note{margin-top:6px;font-size:14px;background:var(--accent-soft);padding:6px 10px;border-radius:6px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);padding:32px 0}
mark{background:var(--accent-soft);color:inherit;padding:0 1px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
</style>

</head>

["TSE / TÜRKAK","Türk Standardları Enstitüsü / Türk Akreditasyon Kurumu","Standart ve akreditasyon kurumları.","tr"],
["KDV / ÖTV","Katma Değer / Özel Tüketim Vergisi","Havacılık bakım ve parça teslimlerinde KDV istisnası koşullarına dikkat.","tr"],
["KVKK","Kişisel Verilerin Korunması Kanunu","Veri işleyen tedarikçi sözleşmelerinde veri işleme ekleri gerekir.","tr"]
];

const chips=document.getElementById('chips'),list=document.getElementById('list'),q=document.getElementById('q'),count=document.getElementById('count');
let active='all';
const norm=s=>s.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text,term){
  if(!term) return esc(text);
  const n=norm(text); const i=n.indexOf(term);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length));
}
function mkChip(key,label){
  const b=document.createElement('button');b.className='chip';b.type='button';b.id='chip-'+key;b.textContent=label;
  b.setAttribute('aria-pressed',key===active);b.onclick=()=>{active=key;
    try{localStorage.setItem('cat',key)}catch(e){}
    [...chips.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();};
  chips.appendChild(b);
}
try{const s=localStorage.getItem('cat'); if(s&&(s==='all'||CATS[s])) active=s;}catch(e){}
mkChip('all','Tümü');Object.entries(CATS).forEach(([k,v])=>mkChip(k,v));
function render(){
  const t=norm(q.value.trim());
  const rows=D.filter(r=>(active==='all'||r[3]===active)&&(!t||norm(r[0]+' '+r[1]+' '+r[2]+' '+(r[4]||'')).includes(t)));
  count.textContent=rows.length+' / '+D.length;
  if(!rows.length){list.innerHTML='<p class="empty">Eşleşen kısaltma yok. Farklı bir yazım veya Türkçe açıklamadan bir kelime deneyin.</p>';return}
  let html='';
  for(const [k,label] of Object.entries(CATS)){
    const g=rows.filter(r=>r[3]===k); if(!g.length) continue;
    html+=`<section><h2>${label}<span>${g.length}</span></h2>`;
    for(const r of g){
      html+=`<div class="row"><div class="abbr">${hl(r[0],t)}</div><div><div class="full">${hl(r[1],t)}</div><div class="tr">${hl(r[2],t)}</div>${r[4]?`<div class="note${r[5]?' warn':''}">${r[5]?'Çift anlam: ':''}${esc(r[4])}</div>`:''}</div></div>`;
    }
    html+='</section>';
  }
  list.innerHTML=html;
}
q.addEventListener('input',render);render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
