<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F1F6">
<style>:root{color-scheme:light;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Nota Avı</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nota Avı">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper: #F2F1F6;
    --card: #FFFFFF;
    --ink: #1C1A2B;
    --muted: #6C6882;
    --rule: #DEDAE9;
    --accent: #5B3F99;
    --accent-soft: #ECE6F8;
    --good: #1F9254;
    --good-bg: #DDF3E6;
    --bad: #C93A3A;
    --bad-bg: #FBE3E3;
    --key: #FFFFFF;
    --key-edge: #CFCADF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #15131D;
      --card: #201D2C;
      --ink: #EDEBF5;
      --muted: #9D99B2;
      --rule: #34304A;
      --accent: #B19AF0;
      --accent-soft: #2D2645;
      --good: #43C982;
      --good-bg: #173726;
      --bad: #F26A6A;
      --bad-bg: #3E1C20;
      --key: #2A2639;
      --key-edge: #3E3955;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #15131D;
    --card: #201D2C;
    --ink: #EDEBF5;
    --muted: #9D99B2;
    --rule: #34304A;
    --accent: #B19AF0;
    --accent-soft: #2D2645;
    --good: #43C982;
    --good-bg: #173726;
    --bad: #F26A6A;
    --bad-bg: #3E1C20;
    --key: #2A2639;
    --key-edge: #3E3955;
  }

  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .app {
    box-sizing: border-box;
    min-height: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }
  h1 span { color: var(--accent); }

  .cat {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 8px;
    border-radius: 999px;
    border: 1.5px solid var(--key-edge);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s;
  }
  .cat svg { width: 40px; height: 40px; display: block; }
  .cat .face { fill: var(--accent-soft); stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; }
  .cat .feat { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .cat .eye { fill: currentColor; }
  .cat .nose { fill: #F08BA8; }
  .cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cat[aria-pressed="true"] .face { fill: var(--accent); stroke: #fff; }
  .cat:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .cat.meow svg { animation: wiggle 0.6s ease-in-out; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-12deg) scale(1.08); }
    60% { transform: rotate(9deg) scale(1.08); }
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    border-radius: 999px;
    background: var(--accent-soft);
  }
  .seg button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    border: 0;
    padding: 7px 14px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(30, 20, 60, 0.15);
  }
  .clefs button { display: inline-flex; align-items: center; gap: 4px; padding-inline: 10px 14px; }
  .clefs svg { height: 24px; width: auto; display: block; fill: currentColor; }
  .link {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    background: none;
    border: 0;
    color: var(--accent);
    cursor: pointer;
    padding: 6px 4px;
  }

  .stage {
    position: relative;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 22px;
    padding: 10px 6px 4px;
    transition: background-color 0.25s, border-color 0.25s;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .stage.good { background: var(--good-bg); border-color: var(--good); }
  .stage.bad { background: var(--bad-bg); border-color: var(--bad); }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 52vh;
    cursor: pointer;
  }
  .staff-line, .ledger { stroke: var(--ink); stroke-width: 1.6; }
  .clef { fill: var(--ink); }
  .note { fill: var(--ink); stroke: var(--ink); transition: fill 0.2s, stroke 0.2s; }
  .note line { stroke-width: 2.2; }
  .stage.good .note { fill: var(--good); stroke: var(--good); }
  .stage.bad .note { fill: var(--bad); stroke: var(--bad); }
  .note.pop { animation: pop 0.35s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .label {
    font-family: inherit;
    font-weight: 800;
    font-size: 22px;
    text-anchor: middle;
    fill: var(--ink);
  }
  .stage.good .label { fill: var(--good); }
  .stage.bad .label { fill: var(--bad); }

  .hint {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.4em;
    margin: 0 0 6px;
  }
  .stage.good .hint, .stage.bad .hint { font-weight: 600; font-size: 1rem; }
  .stage.good .hint { color: var(--good); }
  .stage.bad .hint { color: var(--bad); }

  .keys {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-top: auto;
  }
  .key {
    font: inherit;
    font-weight: 800;
    font-size: clamp(1rem, 4.4vw, 1.5rem);
    color: var(--ink);
    background: var(--key);
    border: 1.5px solid var(--key-edge);
    border-bottom-width: 4px;
    border-radius: 14px;
    padding: 0;
    min-height: 74px;
    cursor: pointer;
    transition: transform 0.06s, background-color 0.2s, border-color 0.2s, color 0.2s;
  }
  .key:active { transform: translateY(2px); border-bottom-width: 2px; }
  .key:focus-visible, .seg button:focus-visible, .link:focus-visible, .stage svg:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .key.right { background: var(--good); border-color: var(--good); color: #fff; }
  .key.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .keys.locked .key:not(.right):not(.wrong) { opacity: 0.45; }

  .switch {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 0;
    padding: 6px 2px;
    cursor: pointer;
  }
  .track {
    width: 38px;
    height: 22px;
    border-radius: 999px;
    background: var(--key-edge);
    position: relative;
    transition: background-color 0.2s;
  }
  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.2s;
  }
  .switch[aria-pressed="true"] .track { background: var(--accent); }
  .switch[aria-pressed="true"] .knob { transform: translateX(16px); }
  .switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  .accs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: auto;
  }
  .accs:not([hidden]) + .keys { margin-top: 0; }
  .acc {
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--muted);
    background: var(--accent-soft);
    border: 1.5px solid transparent;
    border-radius: 12px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s, border-color 0.2s;
  }
  .acc b { font-size: 1.4rem; font-weight: 400; line-height: 1; font-family: "Apple Symbols", "Segoe UI Symbol", "DejaVu Sans", serif; }
  .acc[aria-pressed="true"] { background: var(--card); color: var(--ink); border-color: var(--accent); }
  .acc.right { background: var(--good); border-color: var(--good); color: #fff; }
  .acc.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
  .acc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .accidental { fill: var(--ink); stroke: none; }
  .stage.good .accidental { fill: var(--good); }
  .stage.bad .accidental { fill: var(--bad); }

  @media (max-width: 420px) {
    .keys { gap: 5px; }
    .key { min-height: 64px; border-radius: 11px; }
    h1 { font-size: 1.4rem; }
  }
  @media (min-width: 700px) {
    .key { min-height: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .note.pop { animation: none; }
    .stage, .key { transition: none; }
  }
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Nota <span>Avı</span></h1>
    <button id="cat" class="cat" type="button" aria-pressed="false" aria-label="Kedi sesi">
      <svg viewBox="0 0 48 48" aria-hidden="true">

        <ellipse class="eye" cx="17.5" cy="26" rx="2.4" ry="3.2"/>

        <path class="nose" d="M22 31 H26 L24 33.4 Z"/>
        <path class="feat" d="M24 33.4 Q22 36.5 19.5 35.5 M24 33.4 Q26 36.5 28.5 35.5 M4 29 L14 31 M4 35 L14 33.5 M44 29 L34 31 M44 35 L34 33.5"/>

  </div>

  <div class="stage" id="stage">
    <svg id="staff" viewBox="0 0 360 200" role="button" tabindex="0" aria-label="Portedeki nota. Sesini dinlemek için dokun.">
      <g id="lines"></g>
      <defs>

  <div class="accs" id="accs" hidden>

    <button type="button" class="acc" id="acc-nat" data-acc="0" aria-pressed="true"><b>♮</b> Naturel</button>

  </div>
  <div class="keys" id="keys"></div>

<script>
(function () {
  var NAMES = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"];
  var SEMI = [0, 2, 4, 5, 7, 9, 11];
  var NS = "http://www.w3.org/2000/svg";

  // Staff geometry: pos 0 = bottom line (Mi4), each step = half a space.
  var SP = 16, BOTTOM = 136, NOTE_X = 228;
  function yOf(pos) { return BOTTOM - pos * (SP / 2); }

  // pos -2 = Do4 (C4). Range Do4..La5.
  // Bottom staff line: treble = Mi4, bass = Sol2.
  var CLEFS = { treble: { idx0: 2, oct0: 4 }, bass: { idx0: 4, oct0: 2 } };
  function noteAt(pos) {
    var cf = CLEFS[state.clef];
    var step = pos + cf.idx0;
    var idx = ((step % 7) + 7) % 7;
    var oct = cf.oct0 + Math.floor(step / 7);
    return { pos: pos, idx: idx, acc: 0, midi: 12 * (oct + 1) + SEMI[idx] };
  }
  // Sharps: not on Mi/Si. Flats: not on Do/Fa (kept simple for beginners).
  function withAcc(n, acc) {
    if (acc === 1 && (n.idx === 2 || n.idx === 6)) acc = 0;
    if (acc === -1 && (n.idx === 0 || n.idx === 3)) acc = 0;
    n.acc = acc; n.midi += acc;
    return n;
  }
  var PRAISE = ["Aferin!", "Süper!", "Harika!", "Çok güzel!", "Bravo!"];
  var SYM = { "-1": "♭", "0": "", "1": "♯" };
  var WORD = { "-1": " bemol", "0": "", "1": " diyez" };
  function fullName(n) { return NAMES[n.idx] + WORD[n.acc]; }
  var SHARP_D = "M365 24 319 6V-193L275 -209V-10L138 -63V-262L94 -279V-80L50 -96V0L94 17V262L50 245V341L94 358V589L138 606V376L275 429V659L319 675V446L365 464V366L319 348V104L365 122ZM275 88V332L138 279V34Z", FLAT_D = "M222 441Q275 441 302.0 408.0Q329 375 329 317Q329 273 299.5 234.0Q270 195 192.5 117.0Q115 39 56 -34V783L99 802V402Q148 441 222 441ZM232 308Q232 373 183 373Q159 373 134.5 358.5Q110 344 99 319V87Q159 155 195.5 214.5Q232 274 232 308Z";
  var RANGES = { staff: [0, 8], full: [-2, 10] };

  var state = { clef: "treble", level: "full", accOn: false, pick: 0, current: null, locked: false, catOn: false };
  try {
    var saved = JSON.parse(localStorage.getItem("nota-avi") || "null");
    if (saved) {
      state.level = saved.level === "staff" ? "staff" : "full";
    }
  } catch (e) {}
  function save() {
    try {
      localStorage.setItem("nota-avi", JSON.stringify({ level: state.level }));
    } catch (e) {}
  }

  // ---- Sound ----
  var ctx = null, master = null;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createDynamicsCompressor();
      master.connect(ctx.destination);
      var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  var pianoBufs = {};
  function pianoZone(midi) { return midi <= 44 ? "46" : midi <= 51 ? "45" : midi <= 57 ? "44" : midi <= 64 ? "43" : midi <= 69 ? "42" : midi <= 80 ? "41" : "40"; }
  function pianoBuf(c, id) {
    if (pianoBufs[id]) return pianoBufs[id];
    var bin = atob(PIANO[id].d), n = bin.length >> 1;
    var buf = c.createBuffer(1, n, 22050), ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
      if (v > 32767) v -= 65536;
      ch[i] = v / 32768;
    }
    return (pianoBufs[id] = buf);
  }
  function piano(midi) {
    var c = audio();
    if (!c) return;
    var id = pianoZone(midi), z = PIANO[id];
    var src = c.createBufferSource();
    src.buffer = pianoBuf(c, id);
    src.playbackRate.value = Math.pow(2, (midi - z.root) / 12 + z.fine / 1200);
    src.loop = true;
    src.loopStart = z.ls / 22050;
    src.loopEnd = z.le / 22050;
    var t = c.currentTime + 0.01, dur = 3.2;
    var lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.Q.value = 0.5;
    lp.frequency.setValueAtTime(6000, t);
    lp.frequency.setTargetAtTime(1400, t + 0.05, 0.7);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1.1, t + 0.004);
    g.gain.setTargetAtTime(0.35, t + 0.02, 0.35);
    g.gain.setTargetAtTime(0.0001, t + 0.6, midi < 70 ? 0.9 : 0.7);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur);
  }
  function meow(midi) {
    var c = audio();
    if (!c) return;
    var f = 440 * Math.pow(2, (midi - 69) / 12);
    var t = c.currentTime + 0.01, dur = 0.8;
    var o = c.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(f * 0.8, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.13);
    o.frequency.setValueAtTime(f, t + 0.5);
    o.frequency.exponentialRampToValueAtTime(f * 0.88, t + dur);
    var lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 6.5; lg.gain.value = f * 0.012;
    lfo.connect(lg); lg.connect(o.frequency);
    var out = c.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.7, t + 0.07);
    out.gain.setValueAtTime(0.6, t + 0.45);
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    out.connect(master);
    // Vowel formants sweep "i" -> "a" -> "u": mi-a-uv
    [[[380, 900, 450], 7, 1.0], [[2300, 1400, 850], 9, 0.8], [[3000, 2600, 2400], 10, 0.25]].forEach(function (fm) {
      var bp = c.createBiquadFilter(), g = c.createGain();
      bp.type = "bandpass"; bp.Q.value = fm[1];
      bp.frequency.setValueAtTime(fm[0][0], t);
      bp.frequency.linearRampToValueAtTime(fm[0][1], t + 0.3);
      bp.frequency.linearRampToValueAtTime(fm[0][2], t + dur);
      g.gain.value = fm[2] * 3;
      o.connect(bp); bp.connect(g); g.connect(out);
    });
    o.start(t); lfo.start(t);
    o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
    var cb = document.getElementById("cat");
    cb.classList.remove("meow"); void cb.offsetWidth; cb.classList.add("meow");
  }
  function play(midi) { if (state.catOn) meow(midi); else piano(midi); }

  // ---- Drawing ----
  var linesG = document.getElementById("lines");
  var notesG = document.getElementById("notes");
  function el(name, attrs, parent) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  for (var i = 0; i < 5; i++) {
    var y = yOf(i * 2);
    el("line", { x1: 8, x2: 352, y1: y, y2: y, "class": "staff-line" }, linesG);
  }
  el("line", { x1: 8, x2: 8, y1: yOf(8), y2: yOf(0), "class": "staff-line" }, linesG);
  el("line", { x1: 352, x2: 352, y1: yOf(8), y2: yOf(0), "class": "staff-line", "stroke-width": 2.4 }, linesG);

  function drawNote(n, showName) {
    notesG.innerHTML = "";
    var g = el("g", { "class": "note pop" }, notesG);
    var y = yOf(n.pos);
    // ledger lines
    for (var p = -2; p >= n.pos; p -= 2) el("line", { x1: NOTE_X - 17, x2: NOTE_X + 17, y1: yOf(p), y2: yOf(p), "class": "ledger" }, g);
    for (var q = 10; q <= n.pos; q += 2) el("line", { x1: NOTE_X - 17, x2: NOTE_X + 17, y1: yOf(q), y2: yOf(q), "class": "ledger" }, g);
    // stem
    var up = n.pos < 4;
    var sx = up ? NOTE_X + 8.6 : NOTE_X - 8.6;
    el("line", { x1: sx, x2: sx, y1: y + (up ? -2 : 2), y2: up ? y - 56 : y + 56 }, g);
    // head
    el("ellipse", { cx: NOTE_X, cy: y, rx: 9.6, ry: 6.8, transform: "rotate(-22 " + NOTE_X + " " + y + ")", stroke: "none" }, g);
    // accidental
    if (n.acc === 1) el("path", { d: SHARP_D, "class": "accidental", transform: "translate(" + (NOTE_X - 32) + " " + (y + 9.9) + ") scale(0.05 -0.05)" }, g);
    if (n.acc === -1) el("path", { d: FLAT_D, "class": "accidental", transform: "translate(" + (NOTE_X - 31) + " " + (y + 5.3) + ") scale(0.048 -0.048)" }, g);
    if (showName) {
      var ly = up ? Math.max(y + 34, yOf(-2) + 34) : Math.min(y - 24, yOf(10) - 22);
      var t = el("text", { x: NOTE_X, y: Math.min(Math.max(ly, 22), 196), "class": "label" }, notesG);
      t.textContent = NAMES[n.idx] + SYM[n.acc];
    }
  }

  // ---- Game ----
  var stage = document.getElementById("stage");
  var hint = document.getElementById("hint");
  var keysBox = document.getElementById("keys");
  var keys = NAMES.map(function (name, idx) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "key";
    b.id = "key-" + idx;
    b.textContent = name;
    b.addEventListener("click", function () { answer(idx); });
    keysBox.appendChild(b);
    return b;
  });

  var accsBox = document.getElementById("accs");
  var accBtns = [].slice.call(accsBox.querySelectorAll(".acc"));
  function accBtn(v) { return document.getElementById(v === 1 ? "acc-sharp" : v === -1 ? "acc-flat" : "acc-nat"); }
  function setPick(v) {
    state.pick = v;
    accBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.acc === v)); });
  }
  accBtns.forEach(function (b) {
    b.addEventListener("click", function () { if (!state.locked) setPick(+b.dataset.acc); });
  });

  function renderLevel() {
    document.getElementById("lvl-staff").setAttribute("aria-pressed", state.level === "staff");
    document.getElementById("lvl-full").setAttribute("aria-pressed", state.level === "full");
  }

  function nextNote() {
    var r = RANGES[state.level], pos;
    do { pos = r[0] + Math.floor(Math.random() * (r[1] - r[0] + 1)); }
    while (state.current && pos === state.current.pos);
    var n = noteAt(pos);
    if (state.accOn) {
      var r2 = Math.random();
      withAcc(n, r2 < 0.34 ? 0 : r2 < 0.67 ? 1 : -1);
    }
    state.current = n;
    state.locked = false;
    setPick(0);
    accBtns.forEach(function (b) { b.classList.remove("right", "wrong"); });
    stage.classList.remove("good", "bad");
    keysBox.classList.remove("locked");
    keys.forEach(function (k) { k.classList.remove("right", "wrong"); });
    hint.textContent = "Bu hangi nota?";
    drawNote(state.current, false);
  }

  var timer = null;
  function answer(idx) {
    if (state.locked || !state.current) return;
    state.locked = true;
    keysBox.classList.add("locked");
    var n = state.current;
    var accOk = !state.accOn || state.pick === n.acc;
    var ok = idx === n.idx && accOk;
    if (ok) {
      stage.classList.add("good");
      keys[idx].classList.add("right");
      if (state.accOn) accBtn(n.acc).classList.add("right");
      hint.textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)] + " Bu nota " + fullName(n) + ".";
    } else {
      stage.classList.add("bad");
      if (idx !== n.idx) keys[idx].classList.add("wrong");
      keys[n.idx].classList.add("right");
      if (state.accOn) {
        if (!accOk) accBtn(state.pick).classList.add("wrong");
        accBtn(n.acc).classList.add("right");
      }
      hint.textContent = "Bu nota " + fullName(n) + ". Birlikte dinleyelim.";
    }
    drawNote(n, true);
    play(n.midi);
    clearTimeout(timer);
    timer = setTimeout(nextNote, ok ? 1100 : 2600);
  }

  var staffSvg = document.getElementById("staff");
  staffSvg.addEventListener("click", function () { if (state.current) play(state.current.midi); });
  staffSvg.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (state.current) play(state.current.midi); }
  });

  function setClef(cl) {
    if (state.clef === cl) return;
    state.clef = cl;
    document.getElementById("clef-use").setAttribute("href", cl === "bass" ? "#g-bass" : "#g-treble");
    document.getElementById("clef-treble").setAttribute("aria-pressed", String(cl === "treble"));
    document.getElementById("clef-bass").setAttribute("aria-pressed", String(cl === "bass"));
    clearTimeout(timer); state.current = null; nextNote();
  }
  document.getElementById("clef-treble").addEventListener("click", function () { setClef("treble"); });
  document.getElementById("clef-bass").addEventListener("click", function () { setClef("bass"); });

  function setLevel(l) {
    if (state.level === l) return;
    state.level = l; save(); renderLevel();
    clearTimeout(timer); state.current = null; nextNote();
  }
  document.getElementById("lvl-staff").addEventListener("click", function () { setLevel("staff"); });
  document.getElementById("lvl-full").addEventListener("click", function () { setLevel("full"); });
  var accToggle = document.getElementById("acc-toggle");
  accToggle.addEventListener("click", function () {
    state.accOn = !state.accOn;
    accToggle.setAttribute("aria-pressed", String(state.accOn));
    accsBox.hidden = !state.accOn;
    clearTimeout(timer); state.current = null; nextNote();
  });
  var catBtn = document.getElementById("cat");
  catBtn.addEventListener("click", function () {
    state.catOn = !state.catOn;
    catBtn.setAttribute("aria-pressed", String(state.catOn));
    document.getElementById("cat-label").textContent = state.catOn ? "Miyav!" : "Kedi sesi";
    play(state.catOn ? 67 : 60);
  });

  // Keyboard shortcuts on iPad with keyboard: 1-7
  document.addEventListener("keydown", function (e) {
    var d = parseInt(e.key, 10);
    if (d >= 1 && d <= 7) answer(d - 1);
  });
  // Unlock audio on first touch (iOS)
  ["touchstart", "pointerdown"].forEach(function (ev) {
    document.addEventListener(ev, function once() { audio(); document.removeEventListener(ev, once); }, { passive: true });
  });

  renderLevel(); nextNote();
  hint.textContent = "Notaya dokun, sesini dinle. Sonra aşağıdan adını seç.";
})();
